name: Recovery AERA Redmi 14C (lake)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - recovery_build: 'aera-16.0-lake'
            manifest_branch: 'aera-16.0'
            device_tree_url: 'https://github.com/SavedByLight/android_device_xiaomi_lake.git'
            device_tree_branch: 'android-16'
            makefile_name: 'twrp_lake'
            build_tree: 'twrp'

    env:
      DEVICE_PATH: 'device/xiaomi/lake'
      COMMON_TREE_URL: ''
      COMMON_PATH: ''
      DEVICE_NAME: 'lake'
      BUILD_TARGET: 'recovery'

    steps:
    - name: Check Out
      uses: actions/checkout@v3

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev x11proto-core-dev libx11-dev tree lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache liblz4-tool libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static python3 zip unzip git repo

    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.email "halk56855@gmail.com"
        git config --global user.name "Halk56855"
        repo init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b ${{ matrix.manifest_branch }}
      id: pwd

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace

    - name: Clone device tree
      run: |
        git clone ${{ matrix.device_tree_url }} -b ${{ matrix.device_tree_branch }} ./${{ env.DEVICE_PATH }} || git clone ${{ matrix.device_tree_url }} ./${{ env.DEVICE_PATH }}
        rm -f ./${{ env.DEVICE_PATH }}/Android.mk
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: env.COMMON_TREE_URL != '' && env.COMMON_PATH != ''
      run: |
        git clone ${{ env.COMMON_TREE_URL }} -b master ./${{ env.COMMON_PATH }} || git clone ${{ env.COMMON_TREE_URL }} ./${{ env.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Sync Device Dependencies
      run: |
        bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ env.DEVICE_PATH }}/${{ matrix.build_tree }}.dependencies || true
        repo sync -j$(nproc --all) || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ matrix.makefile_name }}-trunk_staging-eng || lunch ${{ matrix.makefile_name }}-ap4a-eng || lunch ${{ matrix.makefile_name }}-eng
        make clean
        make ${{ env.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ env.DEVICE_NAME }}/${{ env.BUILD_TARGET }}.img
          workspace/out/target/product/${{ env.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ env.DEVICE_NAME }}/*vendor*.img
        name: "lake-aera-${{ matrix.recovery_build }}-release"
        tag_name: "aera-lake-${{ matrix.recovery_build }}"
        body: |
          Device: Redmi 14C (lake)
          Manifest / Version: ${{ matrix.manifest_branch }}
          Device Tree: ${{ matrix.device_tree_url }} (${{ matrix.device_tree_branch }})
          Target: ${{ env.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
