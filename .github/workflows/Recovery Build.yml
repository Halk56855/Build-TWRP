name: Ultimate Recovery Build with Advanced Features

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Halk56855/android_recovery_samsung_a04'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/samsung/a04'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
        default: 'https://github.com/rsuplaygrnd/android_recovery_samsung_mt6765-common.git'
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
        default: 'device/samsung/jdm-mt6765-cmn'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'a04'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_a04'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev x11proto-core-dev libx11-dev tree lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache liblz4-tool libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static python3 zip unzip git repo

    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.email "halk56855@gmail.com"
        git config --global user.name "Halk56855"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd
          
    - name: Repo Sync with Retry
      run: |
        for i in {1..5}; do
          repo sync -j4 --force-sync && break
          echo "Repo sync failed. Retrying ($i/5)..."
          sleep 10
        done
      working-directory: workspace
      
    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }} || git clone ${{ github.event.inputs.DEVICE_TREE_URL }} ./${{ github.event.inputs.DEVICE_PATH }}
        rm -f ./${{ github.event.inputs.DEVICE_PATH }}/Android.mk
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b master ./${{ github.event.inputs.COMMON_PATH }} || git clone ${{ github.event.inputs.COMMON_TREE_URL }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Inject Advanced Features & Patches into Device Tree
      run: |
        DEVICE_DIR="./${{ github.event.inputs.DEVICE_PATH }}"
        
        # 1. الحقن في BoardConfig.mk (فك التشفير، أحسام الأقسام الكبيرة، وتجاوز حجم IMG)
        BOARD_CONFIG=$(find "$DEVICE_DIR" -name "BoardConfig.mk")
        if [ -f "$BOARD_CONFIG" ]; then
          echo "Injecting Advanced Build Flags into $BOARD_CONFIG"
          echo "" >> "$BOARD_CONFIG"
          echo "# --- Ultimate Advanced Features Added Automatically ---" >> "$BOARD_CONFIG"
          echo "BOARD_SELINUX_RECOVERY_IGNORE_AVB := true" >> "$BOARD_CONFIG"
          echo "BOARD_HAS_LARGE_FILESYSTEM := true" >> "$BOARD_CONFIG"
          echo "TW_INCLUDE_CRYPTO := true" >> "$BOARD_CONFIG"
          echo "TW_INCLUDE_CRYPTO_FBE := true" >> "$BOARD_CONFIG"
          echo "PLATFORM_SECURITY_PATCH := 2099-12-31" >> "$BOARD_CONFIG"
          echo "TW_SKIP_COMPATIBILITY_CHECK := true" >> "$BOARD_CONFIG"
          echo "TW_INCLUDE_REPACKTOOLS := true" >> "$BOARD_CONFIG"
          echo "TW_INCLUDE_RESETPROP := true" >> "$BOARD_CONFIG"
          echo "TW_INCLUDE_FASTBOOTD := true" >> "$BOARD_CONFIG"
          echo "TW_USE_MAGISKBOOT := 1" >> "$BOARD_CONFIG"
          echo "TW_USE_MAGISKBOOT_FOR_ALL_PATCHES := 1" >> "$BOARD_CONFIG"
        fi

        # 2. تعديل ملف fstab لدعم فك التشفير، وضع القراءة والكتابة (R/W)، وإضافة system_root
        FSTAB_FILE=$(find "$DEVICE_DIR" -name "fstab*")
        if [ -f "$FSTAB_FILE" ]; then
          echo "Modifying fstab: $FSTAB_FILE"
          sed -i 's/fileencryption=/encryptable=/g' "$FSTAB_FILE" || true
          sed -i 's/ro,/rw,/g' "$FSTAB_FILE" || true
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release (Ultimate Version)
      uses: softprops/action-gh-release@v1
      with:
        files: | 
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: "TWRP Ultimate Master - Full Features (FBE, R/W, Magisk/KernelSU)"
        tag_name: "twrp-ultimate-master-v1"
        body: |
          ميزات النسخة الشاملة:
          - دعم SELinux Permissive وتجاوز قيود AVB.
          - دعم أوضاع القراءة والكتابة (Read/Write) وإدارة system_root.
          - فك تشفير الذاكرة الداخلية (FBE Decryption).
          - تجاوز الحجم الأقصى لملفات IMG والتفليش الآمن.
          - دمج أدوات Magiskboot و KernelSU.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
