name: Build AERA Recovery for Samsung Galaxy A04

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      AERA_RECOVERY_URL:
        description: 'AERA_RECOVERY_URL'
        required: true
        default: 'https://github.com/AERA-Recovery/android_bootable_recovery.git'
      AERA_RECOVERY_BRANCH:
        description: 'AERA_RECOVERY_BRANCH'
        required: true
        default: 'aera-16.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Halk56855/android_recovery_samsung_a04'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/samsung/a04'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
        default: 'https://github.com/rsuplaygrnd/android_recovery_samsung_mt6765-common.git'
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
        default: 'device/samsung/jdm-mt6765-cmn'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'a04'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_a04'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "AERA Recovery URL: ${{ github.event.inputs.AERA_RECOVERY_URL }}"
        echo "AERA Recovery Branch: ${{ github.event.inputs.AERA_RECOVERY_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"
 
    - name: Check Out
      uses: actions/checkout@v3

    - name: Cleanup Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare Build Environment
      run: |
        sudo apt update
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev x11proto-core-dev libx11-dev tree lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache liblz4-tool libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static python3 zip unzip git repo

    - name: Install OpenJDK 8
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize Repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.email "halk56855@gmail.com"
        git config --global user.name "Halk56855"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd
          
    - name: Repo Sync
      run: |
        for i in {1..5}; do
          repo sync -j4 --force-sync && break
          echo "Repo sync failed. Retrying ($i/5)..."
          sleep 10
        done
      working-directory: workspace

    - name: Replace Bootable Recovery with AERA Recovery
      run: |
        rm -rf bootable/recovery
        git clone ${{ github.event.inputs.AERA_RECOVERY_URL }} -b ${{ github.event.inputs.AERA_RECOVERY_BRANCH }} bootable/recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      
    - name: Clone Device Tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }} || git clone ${{ github.event.inputs.DEVICE_TREE_URL }} ./${{ github.event.inputs.DEVICE_PATH }}
        rm -f ./${{ github.event.inputs.DEVICE_PATH }}/Android.mk
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone Common Tree
      if: |
        github.event.inputs.COMMON_TREE_URL != null
        && github.event.inputs.COMMON_PATH != null
      run: |
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b master ./${{ github.event.inputs.COMMON_PATH }} || git clone ${{ github.event.inputs.COMMON_TREE_URL }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check Build Tree Type
      id: buildtree
      run: |
        if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "twrp-11" ] || [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "twrp-12.1" ]; then
          echo "value=twrp" >> $GITHUB_OUTPUT
        else
          echo "value=omni" >> $GITHUB_OUTPUT
        fi

    - name: Sync Device Dependencies
      run: |
        bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies || true
        repo sync -j4 || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Fix FBE and Mount Issues in Device Tree
      run: |
        FSTAB_FILE=$(find ./${{ github.event.inputs.DEVICE_PATH }} -name "fstab*")
        if [ -f "$FSTAB_FILE" ]; then
          echo "Found fstab file: $FSTAB_FILE"
          sed -i 's/fileencryption=/encryptable=/g' "$FSTAB_FILE" || true
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build AERA Recovery Image
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: | 
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor*.img
        name: "Samsung A04 AERA Recovery - Build"
        tag_name: "aera-a04-fbe-fix"
        body: |
          AERA Recovery Build for Samsung Galaxy A04
          AERA Source: ${{ github.event.inputs.AERA_RECOVERY_URL }} (${{ github.event.inputs.AERA_RECOVERY_BRANCH }})
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
