name: Build OrangeFox 14.1 for Galaxy A04 (Black Theme)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: false

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev python3 python-is-python3 aria2

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/local/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Sync OrangeFox 14.1 Sources
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        mkdir -p ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch 14.1 --path ~/fox_14.1

    - name: Clone A04 Trees (Device, Kernel, Vendor)
      run: |
        cd ~/fox_14.1
        git clone https://github.com/A04-Trees-and-ROMs/android_device_samsung_a04.git -b lineage-22.2 device/samsung/a04
        git clone https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git -b lineage-22.2 kernel/samsung/a04 || git clone https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git kernel/samsung/a04
        git clone https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git -b lineage-22.2 vendor/samsung/a04 || git clone https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git vendor/samsung/a04

    - name: Configure OrangeFox & Patch Device Tree
      run: |
        cd ~/fox_14.1/device/samsung/a04
        
        # استبدال استدعاءات vendor/lineage غير الموجودة بملفات النظام القياسية لـ AOSP/TWRP
        sed -i 's|vendor/lineage/config/common_full_phone.mk|build/make/target/product/base_system.mk|g' lineage_a04.mk
        sed -i 's|vendor/lineage/config/common.mk|build/make/target/product/base_system.mk|g' lineage_a04.mk
        sed -i '/vendor\/lineage/d' lineage_a04.mk

        # إضافة خيار الـ lunch الثلاثي لأندرويد 14.1
        echo "" >> AndroidProducts.mk
        echo "COMMON_LUNCH_CHOICES += \\" >> AndroidProducts.mk
        echo "    lineage_a04-ap2a-eng" >> AndroidProducts.mk

    - name: Build OrangeFox Recovery (With Black Theme Configs)
      run: |
        cd ~/fox_14.1
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_BUILD_DEVICE=a04
        export OF_MAINTAINER="Halk56855"
        
        # إعدادات الوضع الأسود والثيم الداكن المخصصة لـ OrangeFox
        export OF_USE_DARK_MODE=1
        export OF_ALLOW_DISABLE_NAVBAR=0
        
        source build/envsetup.sh
        lunch lineage_a04-ap2a-eng
        mka recoveryimage

    - name: Upload OrangeFox Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-R11.1-A14.1-samsung-a04-Black
        path: |
          ~/fox_14.1/out/target/product/a04/OrangeFox*.zip
          ~/fox_14.1/out/target/product/a04/recovery.img
