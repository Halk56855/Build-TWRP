name: Recovery TWRP Multi-Build (11 & 12.1)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Version / Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - 'twrp-11'
          - 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'Select Device Tree URL'
        required: true
        default: 'https://github.com/Halk56855/android_device_samsung_a04-TWRP.git'
        type: choice
        options:
          - 'https://github.com/Halk56855/android_device_samsung_a04-TWRP.git'
          - 'https://github.com/Halk56855/android_recovery_samsung_a04.git'
          - 'https://github.com/Halk56855/a04-TWRP-11-dt.git'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch (e.g., twrp-11 or twrp-12.1)'
        required: true
        default: 'twrp-12.1'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/samsung/a04'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (Leave empty if not needed)'
        required: false
        default: 'https://github.com/rsuplaygrnd/android_recovery_samsung_mt6765-common.git'
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
        default: 'device/samsung/jdm-mt6765-cmn'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'a04'
      MAKEFILE_NAME:
        description: 'Makefile Name (e.g., twrp_a04 or omni_a04)'
        required: true
        default: 'twrp_a04'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"
 
    - name: Check Out
      uses: actions/checkout@v3

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev x11proto-core-dev libx11-dev tree lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache liblz4-tool libsdl1.2-dev libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static python3 zip unzip git repo

    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.email "halk56855@gmail.com"
        git config --global user.name "Halk56855"
        
        # اختيار المانيفست بناءً على إصدار TWRP المحدد
        if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "twrp-11" ]; then
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-11
        else
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
        fi
      id: pwd
          
    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace
      
    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }} || git clone ${{ github.event.inputs.DEVICE_TREE_URL }} ./${{ github.event.inputs.DEVICE_PATH }}
        rm -f ./${{ github.event.inputs.DEVICE_PATH }}/Android.mk
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != ''
        && github.event.inputs.COMMON_PATH != ''
      run: |
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b master ./${{ github.event.inputs.COMMON_PATH }} || git clone ${{ github.event.inputs.COMMON_TREE_URL }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ّ steps.pwd.outputs.workspace-folder }}

    - name: Check Build Tree
      id: buildtree
      run: |
        if [ "${{ github.event.inputs.MANIFEST_BRANCH }}" = "twrp-11" ]; then
          echo "value=omni" >> $GITHUB_OUTPUT
        else
          echo "value=twrp" >> $GITHUB_OUTPUT
        fi

    - name: Sync Device Dependencies
      run: |
        bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies || true
        repo sync -j$(nproc --all) || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: | 
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*vendor*.img
        name: "a04-twrp-${{ github.event.inputs.MANIFEST_BRANCH }}-release"
        tag_name: "twrp-a04-${{ github.event.inputs.MANIFEST_BRANCH }}"
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device Tree: ${{ github.event.inputs.DEVICE_TREE_URL }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
